name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What the deployment needs from GITHUB_TOKEN: id-token is for the
# OIDC exchange deploy-pages uses, not an optional extra.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already uploading; queued runs collapse
# to the newest instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build

      # The map is emitted for local debugging but would be fetchable at a
      # derivable URL once published, handing the class the original
      # source that sourcemap: "hidden" was meant to keep out of reach.
      - name: Drop sourcemaps from the published site
        run: rm -f dist/assets/*.map

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
